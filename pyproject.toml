[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volatility-mlops"
version = "0.1.0"
description = "Volatility forecasting and retirement-outcome engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ram" }]

dependencies = [
  # data
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",
  # market-data source (free dev provider; swappable behind the provider
  # interface in src/.../ingestion/base.py). See docs/decisions.md.
  "yfinance>=0.2.40",
  # model + econometric baselines
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "arch>=7.0",
  # storage
  "SQLAlchemy>=2.0",
  "psycopg2-binary>=2.9",
  # tracking + registry
  # Pinned below 3.0: registry stages (Staging/Production), which the promotion
  # gate in build-plan section 7.5 is written around, were removed in MLflow 3.
  "mlflow>=2.20,<3",
  # orchestration
  "prefect>=3.0",
  # drift monitoring
  "evidently>=0.4",
  # serving
  "flask>=3.0",
  # config + env
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML",
  "pandas-stubs",
]
notebooks = [
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/volatility_mlops"]

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: requires a running Postgres or MLflow (deselect with -m 'not integration')",
]
filterwarnings = ["error::DeprecationWarning:volatility_mlops.*"]

# -----------------------------------------------------------------------------
# ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "ANN",  # annotations - CLAUDE.md requires type hints on public functions
  "D",    # docstrings - units and time conventions must be stated
  "NPY",  # numpy legacy random / API
  "PD",   # pandas anti-patterns
]
ignore = [
  "ANN401",  # allow typing.Any where genuinely needed
  "D107",    # __init__ docstring covered by the class docstring
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"scripts/**" = ["D"]
"**/__init__.py" = ["D104"]

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
# Type-check against the actual dev interpreter (3.12): numpy 2.x stubs use the
# 3.12-only `type` statement. Source stays 3.11-compatible, enforced by ruff's
# target-version = "py311" plus the pyupgrade (UP) rules.
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["arch.*", "evidently.*", "mlflow.*", "statsmodels.*", "prefect.*", "yfinance.*"]
ignore_missing_imports = true
