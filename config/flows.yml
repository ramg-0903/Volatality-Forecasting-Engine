# Orchestration parameters (build-plan section 9).
# Used by the Prefect daily inference flow (Day 19) and the weekly retrain flow (Day 20).
ingest_lookback_days: 5        # re-ingest this many business days each run (overlap catches late corrections)
prediction_horizon_days: 21    # forecast horizon; resolves_on = as_of + this many business days
schedule_cron: "0 22 * * 1-5"  # weekday evenings 22:00 (worker stood up on Day 26)

# Weekly retrain flow (section 9.2).
retrain_cron: "0 2 * * 6"        # Saturday 02:00, off-hours
row_count_drop_tolerance: 0.02   # abort retrain if the labelled panel shrinks >2% vs the live model's training size
