name: data-contract

# Guards the feature contract: on any PR that touches the feature module or the
# contract file, rebuild features from a synthetic dataset and assert the produced
# columns still match config/feature_contract.yml. A feature change without a matching
# contract (and version) update fails this job -- a cheap answer to "how do you stop a
# feature change from silently breaking a deployed model?"
on:
  pull_request:
    paths:
      - "src/volatility_mlops/features/**"
      - "config/feature_contract.yml"
      - "config/universe.yml"
      - "tests/unit/test_data_contract.py"

concurrency:
  group: data-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Assert features match the committed contract
        run: pytest tests/unit/test_data_contract.py -q
