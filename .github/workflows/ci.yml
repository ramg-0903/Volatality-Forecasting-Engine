name: ci

# Lint, format check, type check, and the deterministic unit suite with coverage.
# Integration tests (marked `integration`) need a live Postgres + MLflow and a
# registered Production model, so they are excluded here and run locally via
# `make up && make test`. The unit suite covers the project's load-bearing checks
# (leakage, target construction, promotion gate, Monte Carlo, ...).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests with coverage
        run: >-
          pytest -m "not integration"
          --cov=volatility_mlops
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
